name: macOS beta

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/macos-beta.yml
      - LICENSE
      - rust/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable
      - name: Build and verify Apple Silicon disk image
        run: bash rust/macos/package.sh
      - name: Upload beta assets
        uses: actions/upload-artifact@v6
        with:
          name: clip-everything-macos-arm64
          path: |
            rust/dist/macos-beta/ClipEverything-macOS-arm64.dmg
            rust/dist/macos-beta/SHA256SUMS.txt
          if-no-files-found: error
