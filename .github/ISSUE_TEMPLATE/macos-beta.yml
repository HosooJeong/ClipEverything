name: macOS beta bug report
description: Report a problem with the ClipEverything macOS beta.
title: "[macOS beta] "
body:
  - type: input
    id: environment
    attributes:
      label: ClipEverything version, macOS version, and Mac chip
      placeholder: "0.6.14 macOS beta 1, macOS 15.6, Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the app you copied from, the clip type, and how you opened ClipEverything when relevant. Use sample data in place of private clipboard contents.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: An error message or a screenshot with sensitive information removed can help.
    validations:
      required: true
