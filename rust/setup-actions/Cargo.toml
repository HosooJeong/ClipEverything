[package]
name = "clip-setup-actions"
version = "0.6.12"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
clip-everything = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.37"
windows-sys = { version = "0.61", features = ["Win32_System_ApplicationInstallationAndServicing","Win32_System_Com","Win32_System_Registry"] }
