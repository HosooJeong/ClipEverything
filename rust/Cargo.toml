[package]
name = "clip-everything"
version = "0.6.14"
edition = "2024"
default-run = "clip-everything"

[dependencies]
anyhow = "1"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png","bmp","ico"] }

[target.'cfg(windows)'.dependencies]
tao = "0.34"
windows-sys = { version = "0.61", features = ["Win32_Foundation","Win32_System_DataExchange","Win32_System_Memory","Win32_System_Threading","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_UI_Input_KeyboardAndMouse","Win32_UI_WindowsAndMessaging","Win32_System_Ole","Win32_System_LibraryLoader","Win32_System_Registry","Win32_System_SystemServices","Win32_UI_Shell","Win32_Security","Win32_Globalization","Win32_System_ApplicationInstallationAndServicing","Win32_System_SystemInformation","Win32_System_StationsAndDesktops","Win32_Storage_FileSystem","Win32_UI_Accessibility","Win32_UI_Controls","Win32_UI_HiDpi","Win32_UI_Input_Ime"] }

[build-dependencies]
resvg = { version = "0.45", default-features = false }

[profile.release]
strip = true

[workspace]
members = ["setup-actions"]
default-members = ["."]
resolver = "3"
